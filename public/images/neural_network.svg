<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pulse {
        0%, 100% { fill: #1e3a8a; stroke-width: 2px; stroke: #3b82f6; filter: drop-shadow(0 0 5px rgba(59,130,246,0)); }
        50% { fill: #3b82f6; stroke-width: 4px; stroke: #93c5fd; filter: drop-shadow(0 0 15px rgba(96,165,250,0.8)); }
      }
      @keyframes flow {
        to { stroke-dashoffset: -24; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      
      .node {
        animation: pulse 3s infinite ease-in-out;
      }
      .node-1 { animation-delay: 0.0s; }
      .node-2 { animation-delay: 0.5s; }
      .node-3 { animation-delay: 1.0s; }
      .node-4 { animation-delay: 1.5s; }
      
      .line {
        stroke-dasharray: 12 12;
        animation: flow 1s linear infinite;
      }
      
      .layer-group {
        animation: float 6s infinite ease-in-out;
      }
      .layer-group-2 { animation-delay: 2s; }
      .layer-group-3 { animation-delay: 4s; }
    </style>
  </defs>

  <!-- Background matching the dark UI -->
  <rect width="800" height="500" fill="#050816" rx="16"/>
  
  <!-- Titles -->
  <text x="150" y="50" fill="#94a3b8" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Input Layer</text>
  <text x="400" y="50" fill="#94a3b8" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Hidden Layer</text>
  <text x="650" y="50" fill="#94a3b8" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Output Layer</text>
  
  <!-- Connections (Lines) -->
  <g stroke="#3b82f6" stroke-width="2" stroke-opacity="0.5" class="line">
    <!-- Input to Hidden -->
    <line x1="150" y1="150" x2="400" y2="100"/>
    <line x1="150" y1="150" x2="400" y2="200"/>
    <line x1="150" y1="150" x2="400" y2="300"/>
    <line x1="150" y1="150" x2="400" y2="400"/>
    
    <line x1="150" y1="250" x2="400" y2="100"/>
    <line x1="150" y1="250" x2="400" y2="200"/>
    <line x1="150" y1="250" x2="400" y2="300"/>
    <line x1="150" y1="250" x2="400" y2="400"/>
    
    <line x1="150" y1="350" x2="400" y2="100"/>
    <line x1="150" y1="350" x2="400" y2="200"/>
    <line x1="150" y1="350" x2="400" y2="300"/>
    <line x1="150" y1="350" x2="400" y2="400"/>
    
    <!-- Hidden to Output -->
    <line x1="400" y1="100" x2="650" y2="250"/>
    <line x1="400" y1="200" x2="650" y2="250"/>
    <line x1="400" y1="300" x2="650" y2="250"/>
    <line x1="400" y1="400" x2="650" y2="250"/>
  </g>
  
  <!-- Nodes and Text (Grouped by Layer for floating animation) -->
  
  <!-- Input Layer -->
  <g class="layer-group">
    <g stroke="#60a5fa">
      <circle cx="150" cy="150" r="24" class="node node-1"/>
      <circle cx="150" cy="250" r="24" class="node node-2"/>
      <circle cx="150" cy="350" r="24" class="node node-3"/>
    </g>
    <g fill="white" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      <text x="150" y="155">X1</text>
      <text x="150" y="255">X2</text>
      <text x="150" y="355">X3</text>
    </g>
  </g>

  <!-- Hidden Layer -->
  <g class="layer-group layer-group-2">
    <g stroke="#60a5fa">
      <circle cx="400" cy="100" r="24" class="node node-2"/>
      <circle cx="400" cy="200" r="24" class="node node-3"/>
      <circle cx="400" cy="300" r="24" class="node node-4"/>
      <circle cx="400" cy="400" r="24" class="node node-1"/>
    </g>
  </g>

  <!-- Output Layer -->
  <g class="layer-group layer-group-3">
    <g stroke="#60a5fa">
      <circle cx="650" cy="250" r="24" class="node node-4"/>
    </g>
    <g fill="white" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      <text x="650" y="255">Y</text>
    </g>
  </g>
  
</svg>
