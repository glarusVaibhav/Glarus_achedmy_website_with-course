<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0f172a" rx="12"/>
  <!-- Left Side: Dark Terminal -->
  <rect x="40" y="50" width="330" height="300" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="40" y="50" width="330" height="30" fill="#334155"/>
  <circle cx="60" cy="65" r="5" fill="#ef4444"/>
  <circle cx="75" cy="65" r="5" fill="#f59e0b"/>
  <circle cx="90" cy="65" r="5" fill="#10b981"/>
  <text x="185" y="70" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Terminal (CLI Only)</text>
  <text x="60" y="110" fill="#38bdf8" font-family="monospace" font-size="13">$ python my_agent.py</text>
  <text x="60" y="135" fill="#94a3b8" font-family="monospace" font-size="12">Processing prompt...</text>
  <text x="60" y="160" fill="#f8fafc" font-family="monospace" font-size="12">Output: {"status": "ok"}</text>
  <text x="205" y="240" fill="#ef4444" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">❌ Unusable for non-coders</text>

  <!-- Arrow -->
  <path d="M 390 200 L 410 200" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Right Side: Web Frontend -->
  <rect x="430" y="50" width="330" height="300" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="430" y="50" width="330" height="30" fill="#1e3a8a"/>
  <text x="595" y="70" fill="#93c5fd" font-family="sans-serif" font-size="12" text-anchor="middle">Web Application Frontend</text>
  <rect x="450" y="95" width="290" height="40" rx="6" fill="#334155"/>
  <text x="465" y="120" fill="#94a3b8" font-family="sans-serif" font-size="13">Ask AI anything...</text>
  <rect x="450" y="150" width="290" height="120" rx="6" fill="#0f172a" stroke="#1e293b"/>
  <text x="465" y="180" fill="#60a5fa" font-family="sans-serif" font-size="13">🤖 AI Assistant:</text>
  <text x="465" y="205" fill="#f8fafc" font-family="sans-serif" font-size="12">Here is your interactive summary!</text>
  <text x="595" y="325" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✅ User-Friendly &amp; Accessible</text>
</svg>