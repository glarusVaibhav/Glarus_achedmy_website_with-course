<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0f172a" rx="12"/>
  <text x="400" y="45" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Event-Driven Python UIs vs Streamlit Rerun</text>
  
  <rect x="50" y="75" width="330" height="280" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="215" y="105" fill="#60a5fa" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Google Mesop</text>
  <text x="70" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Event handlers (on_click, on_input)</text>
  <text x="70" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Angular-like state classes</text>
  <text x="70" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="12">• No full script rerun bottleneck</text>

  <rect x="420" y="75" width="330" height="280" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="585" y="105" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">NiceGUI</text>
  <text x="440" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Pythonic &amp; lightweight</text>
  <text x="440" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Built on Vue.js &amp; FastAPI under hood</text>
  <text x="440" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="12">• High performance for complex apps</text>
</svg>