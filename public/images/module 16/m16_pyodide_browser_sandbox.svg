<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0f172a" rx="12"/>
  <rect x="50" y="40" width="700" height="320" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="400" y="75" fill="#10b981" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Pyodide (WebAssembly Python in Browser)</text>
  
  <rect x="80" y="100" width="640" height="120" rx="6" fill="#0f172a"/>
  <text x="100" y="130" fill="#34d399" font-family="monospace" font-size="13">import numpy as np</text>
  <text x="100" y="155" fill="#34d399" font-family="monospace" font-size="13">arr = np.array([1, 2, 3, 4])</text>
  <text x="100" y="180" fill="#34d399" font-family="monospace" font-size="13">print("Mean:", arr.mean())</text>

  <rect x="80" y="240" width="640" height="90" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="100" y="270" fill="#f8fafc" font-family="monospace" font-size="12">Output (Executed locally via WASM):</text>
  <text x="100" y="295" fill="#38bdf8" font-family="monospace" font-size="13">Mean: 2.5</text>
</svg>