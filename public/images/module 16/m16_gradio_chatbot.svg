<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0f172a" rx="12"/>
  <rect x="60" y="40" width="680" height="320" rx="10" fill="#1e293b" stroke="#f59e0b"/>
  <text x="400" y="75" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">gr.ChatInterface — Dedicated Chatbot UI</text>
  
  <rect x="90" y="100" width="420" height="40" rx="6" fill="#334155"/>
  <text x="105" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="13">What is the difference between LoRA and QLoRA?</text>
  
  <rect x="220" y="150" width="490" height="110" rx="6" fill="#d97706"/>
  <text x="235" y="175" fill="#fef3c7" font-family="sans-serif" font-size="13" font-weight="bold">AI Response (yield streaming):</text>
  <text x="235" y="200" fill="#ffffff" font-family="sans-serif" font-size="12">LoRA trains small adapter matrices. QLoRA also quantizes the base model</text>
  <text x="235" y="220" fill="#ffffff" font-family="sans-serif" font-size="12">to 4-bit precision to run on smaller GPUs.</text>

  <rect x="90" y="285" width="620" height="45" rx="6" fill="#0f172a" stroke="#475569"/>
