<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0f172a" rx="12"/>
  <!-- Left Box: Streamlit -->
  <rect x="50" y="50" width="330" height="300" rx="10" fill="#1e293b" stroke="#ff4b4b" stroke-width="2"/>
  <text x="215" y="90" fill="#ff4b4b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Streamlit</text>
  <text x="215" y="115" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Mental Model: Entire Script Rerun</text>
  <rect x="80" y="140" width="270" height="40" rx="6" fill="#334155"/>
  <text x="215" y="165" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">1. User clicks widget</text>
  <path d="M 215 180 L 215 200" stroke="#ff4b4b" stroke-width="2"/>
  <rect x="80" y="200" width="270" height="40" rx="6" fill="#334155"/>
  <text x="215" y="225" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">2. Re-runs app.py from top to bottom</text>

  <!-- Right Box: Gradio -->
  <rect x="420" y="50" width="330" height="300" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="585" y="90" fill="#f59e0b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Gradio</text>
  <text x="585" y="115" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Mental Model: Function Wrapper</text>
  <rect x="450" y="140" width="270" height="40" rx="6" fill="#334155"/>
  <text x="585" y="165" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">Inputs → Python fn(x) → Outputs</text>
  <path d="M 585 180 L 585 200" stroke="#f59e0b" stroke-width="2"/>
  <rect x="450" y="200" width="270" height="40" rx="6" fill="#334155"/>
  <text x="585" y="225" fill="#f8fafc" font-family="sans-serif" font-size="12" text-anchor="middle">Auto-generates UI + REST API</text>
