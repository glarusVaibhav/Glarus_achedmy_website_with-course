  <rect x="70" y="110" width="170" height="75" rx="4" fill="#334155"/>
  <text x="155" y="152" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Drag &amp; Drop Image</text>

  <rect x="295" y="70" width="210" height="130" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="95" fill="#34d399" font-family="sans-serif" font-size="13" text-anchor="middle">gr.Audio(type="filepath")</text>
  <rect x="315" y="110" width="170" height="75" rx="4" fill="#334155"/>
  <text x="400" y="152" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">🎙️ Record Microphone</text>

  <rect x="540" y="70" width="210" height="130" rx="8" fill="#1e293b" stroke="#334155"/>
