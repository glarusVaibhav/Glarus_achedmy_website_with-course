<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0f172a" rx="12"/>
  <rect x="50" y="30" width="700" height="340" rx="8" fill="#1e293b"/>
  <!-- Header -->
  <text x="80" y="65" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">🤖 AI Chat Assistant (st.chat_message)</text>
  <!-- Messages -->
  <rect x="80" y="90" width="500" height="45" rx="8" fill="#334155"/>
  <text x="95" y="117" fill="#f8fafc" font-family="sans-serif" font-size="13">👤 User: Explain WebSockets vs SSE for AI streaming</text>
  
  <rect x="200" y="145" width="520" height="140" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="215" y="170" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="bold">🤖 Assistant (Streaming...):</text>
  <text x="215" y="195" fill="#e0f2fe" font-family="sans-serif" font-size="12">SSE (Server-Sent Events) is a lightweight HTTP one-way stream.</text>
  <text x="215" y="220" fill="#e0f2fe" font-family="sans-serif" font-size="12">WebSockets provide a persistent two-way connection for audio/voice.</text>

  <!-- Input Bar -->
  <rect x="80" y="305" width="640" height="45" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="100" y="332" fill="#94a3b8" font-family="sans-serif" font-size="13">st.chat_input("Ask me anything...")</text>
</svg>