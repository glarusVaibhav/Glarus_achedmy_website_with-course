<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0f172a" rx="12"/>
  <text x="400" y="45" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">AI Streaming Protocols Compared</text>
  
  <rect x="40" y="70" width="220" height="280" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="150" y="100" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Standard HTTP</text>
  <text x="60" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Single response at end</text>
  <text x="60" y="160" fill="#ef4444" font-family="sans-serif" font-size="11">• 10-30s loading spinner</text>

  <rect x="290" y="70" width="220" height="280" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="100" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Server-Sent Events (SSE)</text>
  <text x="310" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Industry standard for LLMs</text>
  <text x="310" y="160" fill="#10b981" font-family="sans-serif" font-size="11">• Server → Client text stream</text>

  <rect x="540" y="70" width="220" height="280" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="650" y="100" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">WebSockets</text>
  <text x="560" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Bidirectional persistent</text>
  <text x="560" y="160" fill="#c084fc" font-family="sans-serif" font-size="11">• Best for Voice AI / WebRTC</text>
</svg>