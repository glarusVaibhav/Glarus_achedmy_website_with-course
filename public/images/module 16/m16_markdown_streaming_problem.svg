<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0f172a" rx="12"/>
  <text x="400" y="45" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Flicker-Free Streaming Markdown</text>
  
  <rect x="50" y="75" width="330" height="280" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="215" y="105" fill="#ef4444" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Unbuffered Stream (Flickers)</text>
  <text x="70" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="11">Renders partial tokens on every chunk → table layouts jump and shift.</text>

  <rect x="420" y="75" width="330" height="280" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="585" y="105" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Block-Buffered Stream (Smooth)</text>
  <text x="440" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="11">Buffers tokens until full block/line completes → smooth rendering.</text>
</svg>